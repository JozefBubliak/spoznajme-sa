<title>Herd Vote — Výber kategórií</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f3f0;
  color: #1a1814;
  min-height: 100vh;
  padding: 2rem 1.5rem 10rem;
}

/* ── HEADER ── */
.page-header { max-width: 820px; margin: 0 auto 1.5rem; }
.page-title { font-size: 22px; font-weight: 600; color: #1a1814; margin-bottom: .3rem; }
.page-sub { font-size: 13px; color: #7a7268; line-height: 1.6; max-width: 580px; }

/* ── SEARCH ── */
.search-wrap { max-width: 820px; margin: 0 auto 1rem; }
.search-inp {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid #e2ddd8;
  background: #fff;
  color: #1a1814;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search-inp::placeholder { color: #b0a89e; }
.search-inp:focus {
  border-color: #c8c0b8;
  box-shadow: 0 0 0 3px rgba(0,0,0,.06);
}

/* ── FILTERS ── */
.filters {
  max-width: 820px;
  margin: 0 auto 1.5rem;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-btn {
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 99px;
  border: 1px solid #e2ddd8;
  background: #fff;
  color: #7a7268;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
}
.filter-btn:hover {
  border-color: #c8c0b8;
  color: #3d3830;
}
.filter-btn.active {
  background: #1a1814;
  border-color: #1a1814;
  color: #fff;
}

/* ── SECTION LABEL ── */
.section-label {
  max-width: 820px;
  margin: 0 auto .75rem;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #b0a89e;
  display: flex;
  align-items: center;
  gap: .75rem;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e2ddd8;
}

/* ── GRID ── */
.grid {
  max-width: 820px;
  margin: 0 auto 1.25rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

/* ── CARD ── */
.card {
  background: #fff;
  border: 1px solid #e2ddd8;
  border-radius: 12px;
  padding: 13px 14px 12px;
  cursor: pointer;
  transition: all .15s;
  position: relative;
  overflow: hidden;
  user-select: none;
}
.card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2.5px;
  background: #e86b3a;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .2s;
}
.card:hover {
  border-color: #c8c0b8;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
  transform: translateY(-1px);
}
.card:hover::after { transform: scaleX(1); }

.card.selected {
  border: 2px solid #2563eb;
  background: #eff6ff;
  transform: none;
  box-shadow: 0 0 0 3px rgba(37,99,235,.08);
}
.card.selected::after { display: none; }
.card.hidden { display: none; }

/* card inner */
.card-ico {
  font-size: 22px;
  line-height: 1;
  margin-bottom: 8px;
  display: block;
}
.card-name {
  font-size: 13px;
  font-weight: 500;
  color: #1a1814;
  margin-bottom: 3px;
  line-height: 1.3;
}
.card-desc {
  font-size: 11px;
  color: #7a7268;
  line-height: 1.45;
  margin-bottom: 5px;
}
.card-tag {
  font-size: 10px;
  color: #b0a89e;
  letter-spacing: .02em;
}

/* selected state overrides */
.card.selected .card-name { color: #1d4ed8; }
.card.selected .card-desc { color: #3b82f6; opacity: .85; }
.card.selected .card-tag  { color: #93c5fd; }

/* checkmark */
.card-check {
  display: none;
  position: absolute;
  top: 9px; right: 9px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #2563eb;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  align-items: center;
  justify-content: center;
}
.card.selected .card-check { display: flex; }

/* no-results */
.no-results {
  max-width: 820px;
  margin: 2rem auto;
  text-align: center;
  color: #b0a89e;
  display: none;
}
.no-results-ico { font-size: 32px; margin-bottom: .5rem; }
.no-results-t { font-size: 15px; font-weight: 500; color: #7a7268; margin-bottom: .25rem; }
.no-results-s { font-size: 13px; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-top: 1px solid #e2ddd8;
  padding: .9rem 1.5rem;
  z-index: 100;
  box-shadow: 0 -4px 20px rgba(0,0,0,.08);
}
.bottom-inner {
  max-width: 820px;
  margin: 0 auto;
}
.bottom-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: .6rem;
  min-height: 28px;
  align-items: center;
}
.bottom-empty {
  font-size: 12px;
  color: #b0a89e;
  font-style: italic;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px 4px 8px;
  border-radius: 99px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1d4ed8;
  cursor: pointer;
  transition: all .12s;
  max-width: 200px;
}
.pill:hover {
  background: #fee2e2;
  border-color: #fca5a5;
  color: #dc2626;
}
.pill-ico { font-size: 12px; flex-shrink: 0; }
.pill-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill-rm { opacity: .45; font-size: 13px; flex-shrink: 0; }

.bottom-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.bottom-count { font-size: 12px; font-weight: 500; color: #7a7268; }
.bottom-btns { display: flex; gap: 8px; align-items: center; }

.btn-copy {
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid #e2ddd8;
  background: #f5f3f0;
  color: #3d3830;
  cursor: pointer;
  transition: all .12s;
}
.btn-copy:hover { border-color: #c8c0b8; background: #fff; }

.btn-confirm {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 24px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: #fff;
  cursor: pointer;
  transition: all .15s;
}
.btn-confirm:hover { background: #1d4ed8; transform: translateY(-1px); }
.btn-confirm:disabled {
  background: #c8c0b8;
  cursor: not-allowed;
  transform: none;
}

.btn-clear {
  font-family: inherit;
  font-size: 12px;
  color: #b0a89e;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px 8px;
  transition: color .12s;
}
.btn-clear:hover { color: #dc2626; }

@media (max-width: 640px) {
  body { padding: 1.25rem 1rem 12rem; }
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 400px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>

// ── STATE ──────────────────────────────────────────────────────
var state = { group: 'all', search: '', sel: new Set() };

// ── BUILD UI ───────────────────────────────────────────────────
function buildFilters() {
  var el = document.getElementById('filters');
  el.innerHTML = FILTERS.map(function(f) {
    var lbl = f.emoji ? f.emoji + ' ' + f.label : f.label;
    return '<button class="filter-btn' + (f.key === 'all' ? ' active' : '') + '" data-key="' + f.key + '" onclick="setGroup(\'' + f.key + '\', this)">' + lbl + '</button>';
  }).join('');
}

function render() {
  var q = state.search.toLowerCase().trim();
  var filtered = CATS.filter(function(c) {
    if (state.group !== 'all' && c.g !== state.group) return false;
    if (q && (c.n + ' ' + c.d).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  var content = document.getElementById('content');
  var noRes = document.getElementById('no-results');

  if (!filtered.length) {
    content.innerHTML = '';
    noRes.style.display = 'block';
    updateBottom();
    return;
  }
  noRes.style.display = 'none';

  // Group by section or flat
  var html = '';
  if (state.group === 'all' && !q) {
    SECTIONS.forEach(function(sec) {
      var items = filtered.filter(function(c) { return c.g === sec.key; });
      if (!items.length) return;
      html += '<div class="section-label" style="max-width:820px;margin:0 auto .75rem">' + sec.label + '</div>';
      html += '<div class="grid">' + items.map(cardHTML).join('') + '</div>';
    });
  } else {
    html = '<div class="grid">' + filtered.map(cardHTML).join('') + '</div>';
  }

  content.innerHTML = html;
  updateBottom();
}

function cardHTML(c) {
  var sel = state.sel.has(c.n);
  return '<div class="card' + (sel ? ' selected' : '') + '" onclick="toggle(\'' + esc(c.n) + '\', \'' + esc(c.ico) + '\')">'
    + '<div class="card-check">✓</div>'
    + '<span class="card-ico">' + c.ico + '</span>'
    + '<div class="card-name">' + c.n + '</div>'
    + '<div class="card-desc">' + c.d + '</div>'
    + '<div class="card-tag">' + c.t + '</div>'
    + '</div>';
}

function esc(s) {
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ── INTERACTIONS ───────────────────────────────────────────────
function toggle(name, ico) {
  if (state.sel.has(name)) state.sel.delete(name);
  else state.sel.add(name);
  render();
}

function setGroup(key, btn) {
  state.group = key;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

document.getElementById('search').addEventListener('input', function() {
  state.search = this.value;
  render();
});

// ── BOTTOM BAR ────────────────────────────────────────────────
function updateBottom() {
  var pills = document.getElementById('pills');
  var empty = document.getElementById('pills-empty');
  var label = document.getElementById('count-label');
  var confirm = document.getElementById('btn-confirm');
  var clear = document.getElementById('btn-clear');

  if (!state.sel.size) {
    pills.innerHTML = '';
    pills.appendChild(empty);
    empty.style.display = '';
    label.textContent = '0 vybraných';
    confirm.disabled = true;
    clear.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  clear.style.display = '';
  confirm.disabled = false;
  label.textContent = state.sel.size + ' vybraných — klikni na štítok pre odstránenie';

  var html = '';
  state.sel.forEach(function(name) {
    var cat = CATS.find(function(c) { return c.n === name; }) || { ico: '?' };
    html += '<span class="pill" onclick="removePill(\'' + esc(name) + '\')">'
      + '<span class="pill-ico">' + cat.ico + '</span>'
      + '<span class="pill-name">' + name + '</span>'
      + '<span class="pill-rm">×</span>'
      + '</span>';
  });

  pills.innerHTML = html;
  pills.appendChild(empty);
}

function removePill(name) {
  state.sel.delete(name);
  render();
}

function clearAll() {
  state.sel.clear();
  render();
}

function copySel() {
  if (!state.sel.size) return;
  var names = [];
  state.sel.forEach(function(n) { names.push(n); });
  navigator.clipboard.writeText(names.join('\n')).then(function() {
    var b = document.getElementById('btn-copy');
    b.textContent = 'Skopírované ✓';
    setTimeout(function() { b.textContent = 'Kopírovať'; }, 2000);
  });
}

// ── INIT ──────────────────────────────────────────────────────
buildFilters();
render();
