<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herd Vote — Kategórie</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f7f5;
  --bg2: #f0ede9;
  --bg3: #e8e4de;
  --ink: #1a1814;
  --ink2: #3d3830;
  --ink3: #7a7268;
  --ink4: #b0a89e;
  --ink5: #d4cdc6;
  --border: rgba(0,0,0,.09);
  --border2: rgba(0,0,0,.14);
  --accent: #e86b3a;
  --accent2: #c45520;
  --blue: #2563eb;
  --blue-bg: #eff6ff;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --amber: #d97706;
  --amber-bg: #fffbeb;
  --red: #dc2626;
  --red-bg: #fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink)}
body{padding:0}

/* HEADER */
.header{background:var(--ink);padding:2.5rem 2rem 2rem;position:sticky;top:0;z-index:20}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap}
.title-block{}
.logo{font-size:13px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.25rem}
.title{font-size:22px;font-weight:500;color:#fff;line-height:1.2}
.stats-pills{display:flex;gap:8px;flex-wrap:wrap}
.stat-pill{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:99px;border:.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);background:rgba(255,255,255,.06);white-space:nowrap}
.stat-pill .dot{width:7px;height:7px;border-radius:50%}
.dot-green{background:#4ade80}
.dot-amber{background:#fbbf24}
.dot-gray{background:rgba(255,255,255,.3)}

/* SEARCH */
.search-row{display:flex;gap:8px;align-items:center}
.search-inp{flex:1;font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;border-radius:10px;border:.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;outline:none;transition:all .15s}
.search-inp::placeholder{color:rgba(255,255,255,.35)}
.search-inp:focus{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12)}
.clear-btn{font-size:12px;color:rgba(255,255,255,.4);background:none;border:none;cursor:pointer;padding:8px;transition:color .12s;white-space:nowrap}
.clear-btn:hover{color:rgba(255,255,255,.7)}

/* FILTERS */
.filters-wrap{background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 2rem;display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:calc(2.5rem + 2rem + 70px + 40px);z-index:19}
.fb{font-size:12px;font-weight:500;padding:6px 14px;border-radius:99px;border:.5px solid var(--border2);cursor:pointer;background:var(--bg);color:var(--ink3);transition:all .12s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.fb:hover{border-color:var(--ink4);color:var(--ink2)}
.fb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb .cnt{font-size:10px;opacity:.6;font-weight:400}

/* MAIN */
.main{padding:1.5rem 2rem 8rem}
.section-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);margin-bottom:.75rem;margin-top:1.5rem;display:flex;align-items:center;gap:.5rem}
.section-label:first-child{margin-top:0}
.section-label::after{content:'';flex:1;height:.5px;background:var(--border)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#fff;border:.5px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.card:hover::before{transform:scaleX(1)}
.card.sel{border:1.5px solid var(--blue);background:var(--blue-bg)}
.card.sel::before{display:none}
.card.hid{display:none}
.card.no-q{opacity:.65}

/* CARD CONTENT */
.cico{font-size:22px;margin-bottom:7px;display:block;line-height:1}
.cn{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:3px;line-height:1.3}
.cs{font-size:11px;color:var(--ink3);line-height:1.45;margin-bottom:5px}
.ctag{font-size:10px;color:var(--ink4);letter-spacing:.02em}
.card.sel .cn{color:var(--blue)}
.card.sel .ctag{color:#93c5fd}

/* STATUS BADGE */
.cbadge{position:absolute;top:9px;right:9px;font-size:9px;font-weight:600;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.cbadge.has-q{background:var(--green-bg);color:var(--green)}
.cbadge.no-q{background:var(--amber-bg);color:var(--amber)}
.cbadge.sel-badge{background:var(--blue);color:#fff}

/* EMPTY STATE */
.empty{text-align:center;padding:4rem 2rem;color:var(--ink4)}
.empty-ico{font-size:32px;margin-bottom:.75rem}
.empty-t{font-size:15px;font-weight:500;color:var(--ink3);margin-bottom:.35rem}
.empty-s{font-size:13px}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--border);padding:1rem 2rem}
.bottom-inner{max-width:900px;margin:0 auto}
.bottom-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.6rem}
.bottom-label{font-size:12px;font-weight:500;color:var(--ink3)}
.bottom-actions{display:flex;gap:8px;align-items:center}
.btn-confirm{font-size:13px;font-weight:600;padding:9px 24px;border-radius:10px;background:var(--blue);color:#fff;border:none;cursor:pointer;transition:all .15s}
.btn-confirm:hover{background:#1d4ed8;transform:translateY(-1px)}
.btn-confirm:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-clear{font-size:12px;color:var(--ink4);background:none;border:none;cursor:pointer;padding:8px;transition:color .12s}
.btn-clear:hover{color:var(--red)}
.btn-copy{font-size:12px;font-weight:500;padding:8px 16px;border-radius:8px;border:.5px solid var(--border2);background:var(--bg);color:var(--ink2);cursor:pointer;transition:all .12s}
.btn-copy:hover{border-color:var(--ink4)}

/* SELECTED PILLS */
.sel-pills{display:flex;gap:6px;flex-wrap:wrap;min-height:24px}
.sel-pill{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px;border:.5px solid #bfdbfe;background:var(--blue-bg);color:var(--blue);cursor:pointer;transition:all .12s;max-width:200px}
.sel-pill:hover{background:#fee2e2;border-color:#fca5a5;color:var(--red)}
.sel-pill .rm{opacity:.5;margin-left:1px}
.sel-pill .ico{font-size:12px}
.sel-pill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-empty{font-size:12px;color:var(--ink4);font-style:italic;padding:4px 0}

/* NO RESULTS */
#no-results{display:none;text-align:center;padding:3rem;color:var(--ink4)}

@media(max-width:700px){
  .grid{grid-template-columns:1fr 1fr}
  .header,.main,.bottom-bar{padding-left:1.25rem;padding-right:1.25rem}
  .filters-wrap{padding-left:1.25rem;padding-right:1.25rem}
  .header-top{gap:.75rem}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

</div>

<!-- MAIN -->
<div class="main" id="main">

    <div style="font-size:32px;margin-bottom:.75rem">🔍</div>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar" id="bottom-bar">
  <div class="bottom-inner">
    <div class="sel-pills" id="sel-pills">

    </div>
    <div class="bottom-top">
      <div class="bottom-label" id="bottom-label">0 vybraných</div>
      <div class="bottom-actions">
        <button class="btn-clear" id="btn-clear" onclick="clearAll()" style="display:none">Zrušiť všetko</button>

        <button class="btn-confirm" id="btn-confirm" disabled>Potvrdiť výber →</button>
      </div>
    </div>
  </div>
</div>

  {g:'sport',    label:'⚽ Šport'},

];

// ── BUILD COUNTS ──────────────────────────────────────────────
function buildCounts(){
  var all = {};
  CATS.forEach(function(c){all[c.g]=(all[c.g]||0)+1;});
  document.getElementById('cnt-all').textContent='('+CATS.length+')';
  Object.keys(all).forEach(function(g){
    var el=document.getElementById('cnt-'+g);
    if(el) el.textContent='('+all[g]+')';
  });
}

// ── RENDER ─────────────────────────────────────────────────────
function render(){
  var main = document.getElementById('main');
  var q = state.search.toLowerCase().trim();
  var visible = CATS.filter(function(c){
    if(state.group!=='all' && c.g!==state.group) return false;
    if(q && (c.n+c.d).toLowerCase().indexOf(q)<0) return false;
    return true;
  });

  document.getElementById('stat-filtered').textContent = visible.length;
  document.getElementById('no-results').style.display = visible.length?'none':'block';

  if(state.group==='all' && !q){
    // Render by sections
    var html='';
    SECTIONS.forEach(function(sec){
      var items = CATS.filter(function(c){return c.g===sec.g;});
      html += '<div class="section-label">'+sec.label+'</div>';
      html += '<div class="grid" style="margin-bottom:1.25rem">';
      items.forEach(function(c){html+=cardHTML(c);});
      html += '</div>';
    });
    main.innerHTML = html;
  } else {
    var html2 = '<div class="grid">';
    visible.forEach(function(c){html2+=cardHTML(c);});
    html2 += '</div>';
    main.innerHTML = html2;
  }

  // Attach events
  main.querySelectorAll('.card').forEach(function(el){
    el.addEventListener('click',function(){toggle(el.dataset.name);});
  });
  updateSelected();
}

function cardHTML(c){
  var isSel = state.sel.has(c.n);
  var badge = isSel
    ? '<div class="cbadge sel-badge">✓ Vybrané</div>'
    : (c.has_q
      ? '<div class="cbadge has-q">Má otázky</div>'
      : '<div class="cbadge no-q">Treba otázky</div>');
  return '<div class="card'+(isSel?' sel':'')+(c.has_q?'':' no-q')+'" data-name="'+esc(c.n)+'">'
    +badge
    +'<div class="cico">'+c.ico+'</div>'
    +'<div class="cn">'+c.n+'</div>'
    +'<div class="cs">'+c.d+'</div>'
    +'<div class="ctag">'+c.t+'</div>'
    +'</div>';
}

function esc(s){return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── TOGGLE ────────────────────────────────────────────────────
function toggle(name){
  if(state.sel.has(name)) state.sel.delete(name);
  else state.sel.add(name);
  render();
}

// ── SELECTED ─────────────────────────────────────────────────
function updateSelected(){
  var pills = document.getElementById('sel-pills');
  var empty = document.getElementById('sel-empty');
  var label = document.getElementById('bottom-label');
  var btn   = document.getElementById('btn-confirm');
  var bclear= document.getElementById('btn-clear');

  if(!state.sel.size){
    pills.innerHTML='';
    pills.appendChild(document.getElementById('sel-empty'));
    empty.style.display='';
    label.textContent='0 vybraných';
    btn.disabled=true;
    bclear.style.display='none';
    return;
  }
  empty.style.display='none';
  bclear.style.display='';
  btn.disabled=false;
  label.textContent=state.sel.size+' vybraných';

  var h='';
  state.sel.forEach(function(name){
    var cat=CATS.find(function(c){return c.n===name;})||{ico:'?'};
    h+='<div class="sel-pill" onclick="toggle(\''+esc(name)+'\')">'
      +'<span class="ico">'+cat.ico+'</span>'
      +'<span class="nm">'+name+'</span>'
      +'<span class="rm">×</span></div>';
  });
  pills.innerHTML=h;
  pills.appendChild(document.getElementById('sel-empty'));
}

// ── SEARCH ───────────────────────────────────────────────────
function doSearch(v){state.search=v;render();}
function clearSearch(){state.search='';document.getElementById('search').value='';render();}

// ── GROUP ─────────────────────────────────────────────────────
function setGroup(g,btn){
  state.group=g;
  document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  render();
}

// ── CLEAR ALL ─────────────────────────────────────────────────
function clearAll(){state.sel.clear();render();}

// ── COPY SQL ──────────────────────────────────────────────────
function copySel(){
  if(!state.sel.size){alert('Najprv vyber aspoň jednu kategóriu.');return;}
  var names=[];
  state.sel.forEach(function(n){names.push(n);});
  var sql="-- Vybrané kategórie ("+names.length+")\n";
  sql+="SELECT id, name, slug, icon, group_tag\n";
  sql+="FROM herd_categories\n";
  sql+="WHERE name IN (\n";
  sql+=names.map(function(n){return "  '"+n.replace(/'/g,"''")+"'";}).join(",\n");
  sql+="\n);";
  navigator.clipboard.writeText(sql).then(function(){
    var b=document.getElementById('btn-copy');
    var orig=b.textContent;
    b.textContent='Skopírované ✓';
    setTimeout(function(){b.textContent=orig;},2000);
  });
}

// ── INIT ──────────────────────────────────────────────────────
buildCounts();
render();
