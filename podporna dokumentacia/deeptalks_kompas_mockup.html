const groupOrder = ["pary","rodic","priatelia","praca","citlive","deti"];
let activeGroup = null, activeTopic = null, openSit = null;

function renderGroups() {
  const el = document.getElementById("groups");
  el.innerHTML = groupOrder.map(k => {
    const g = DATA[k];
    return `<div class="group-btn${activeGroup===k?' active':''}" onclick="selectGroup('${k}')">
      <span class="group-icon">${g.icon}</span>
      <div class="group-name">${g.name}</div>
      <div class="group-desc">${g.desc}</div>
    </div>`;
  }).join("");
}

function renderPanel() {
  const panel = document.getElementById("panel");
  if (!activeGroup) { panel.innerHTML = '<div class="empty">Vyber si skupinu vyššie</div>'; return; }
  const g = DATA[activeGroup];
  const topic = activeTopic || g.topics[0];
  const sits = g.situations[topic] || [];
  panel.innerHTML = `
    <div class="panel-header">
      <h2>${g.heading}</h2>
      <p>${g.subhead}</p>
    </div>
    <div class="topics">${g.topics.map(t=>`<button class="topic-btn${t===topic?' active':''}" onclick="selectTopic('${t}')">${t}</button>`).join("")}</div>
    <div class="situations">
      <div class="sit-label">Situácie</div>
      ${sits.map((s,i)=>`
        <div class="situation${openSit===i?' open':''}" onclick="toggleSit(${i})">
          <div class="sit-title">${s.title}<span class="sit-tag">${s.tag}</span></div>
          <div class="sit-preview">${s.preview}</div>
          <div class="sit-detail">
            ${s.steps.map(st=>`
              <div class="step-label">${st.label}</div>
              <div class="script-block">${st.text}</div>
            `).join("")}
            <div class="tip">${s.tip}</div>
            <div class="cta-row">
              <button class="cta-btn" onclick="event.stopPropagation();sendPrompt('Daj mi viac situácií pre tému ${s.title} na deeptalks.eu kompas')">Viac situácií</button>
              <button class="cta-btn" onclick="event.stopPropagation();sendPrompt('Navrhni viac konkrétnych viet a skriptov pre situáciu: ${s.title}')">Viac viet</button>
            </div>
          </div>
        </div>
      `).join("")}
    </div>`;
}

function selectGroup(k) { activeGroup=k; activeTopic=DATA[k].topics[0]; openSit=null; renderGroups(); renderPanel(); }
function selectTopic(t) { activeTopic=t; openSit=null; renderPanel(); }
function toggleSit(i) { openSit = openSit===i ? null : i; renderPanel(); }

renderGroups();
renderPanel();
</script>
