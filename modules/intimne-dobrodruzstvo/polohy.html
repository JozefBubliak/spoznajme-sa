<title>Intímne Dobrodružstvo — Polohy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a0f1e;--bg2:#221528;--card:#2d1a3a;--card-hover:#3a2248;
  --accent:#d080e8;--accent2:#f0b0f0;--text:#f0e6f6;--text2:#b090c0;
  --border:#4a2d5a;--gold:#e8c56a;--easy:#5cc88a;--medium:#e8c56a;--hard:#e87878;
}
body{background:var(--bg);color:var(--text);font-family:Georgia,serif;min-height:100vh}

/* HEADER */
header{background:linear-gradient(135deg,#2d0a40,#1a0f1e);padding:20px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:1.5rem;color:var(--accent2);letter-spacing:.04em}
header h1 small{color:var(--text2);font-size:.9rem;font-style:italic}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:20px;font-size:.88rem;width:190px;outline:none;font-family:Georgia,serif}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]::placeholder{color:var(--text2)}
select{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:20px;font-size:.88rem;outline:none;cursor:pointer;font-family:Georgia,serif}
select option{background:var(--bg2)}
button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 15px;border-radius:20px;font-size:.88rem;cursor:pointer;transition:all .18s;font-family:Georgia,serif}
button:hover{background:var(--card-hover);border-color:var(--accent)}
.btn-random{background:linear-gradient(135deg,#6a2080,#a030c0);border-color:var(--accent);font-weight:bold}
.btn-random:hover{background:linear-gradient(135deg,#8030a8,#c050e0)}

/* STATS */
.statsbar{padding:8px 28px;background:var(--bg2);font-size:.82rem;color:var(--text2);display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--border)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:22px 28px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all .18s;position:relative}
.card:hover{background:var(--card-hover);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 22px rgba(160,40,220,.18)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-name{font-size:1.05rem;color:var(--accent2);font-weight:bold}
.fav-btn{background:none;border:none;font-size:1.1rem;cursor:pointer;padding:0;line-height:1;color:var(--text2)}
.fav-btn.on{color:var(--gold)}
.card-cat{display:inline-block;background:rgba(200,80,230,.13);color:var(--accent);font-size:.73rem;padding:3px 10px;border-radius:20px;margin-bottom:9px}
.card-desc{font-size:.83rem;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dot.e{background:var(--easy)}.dot.m{background:var(--medium)}.dot.h{background:var(--hard)}
.diff-lbl{font-size:.73rem;color:var(--text2)}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(8,3,12,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
.mbg.hidden{display:none}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:540px;width:100%;max-height:92vh;overflow-y:auto;padding:30px;position:relative;box-shadow:0 22px 60px rgba(120,0,180,.35)}
.mcl{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text2);font-size:1.4rem;cursor:pointer;padding:4px;line-height:1}
.mcl:hover{color:var(--text)}
.mcat{display:inline-block;background:rgba(200,80,230,.13);color:var(--accent);font-size:.78rem;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.mname{font-size:1.75rem;color:var(--accent2);margin-bottom:8px}
.mdiff{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.mdots{display:flex;gap:5px}
.mdot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.mdot.e{background:var(--easy)}.mdot.m{background:var(--medium)}.mdot.h{background:var(--hard)}
.mdlbl{font-size:.83rem;color:var(--text2)}
.slbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:7px;margin-top:18px}
.mdesc{font-size:.93rem;color:var(--text);line-height:1.72}
.mtip{font-size:.88rem;color:var(--gold);line-height:1.6;background:rgba(232,197,106,.08);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0}
.mprompt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px;font-size:.78rem;color:var(--text2);font-family:monospace;line-height:1.5;margin-top:7px;word-break:break-word}
.bcopy{margin-top:7px;font-size:.8rem;padding:6px 13px}
.mnav{display:flex;gap:8px;margin-top:22px;justify-content:space-between}
.mnav button{flex:1}
.mfav{font-size:.9rem}
.mfav.on{color:var(--gold);border-color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;color:var(--text2);padding:60px 20px;font-size:1rem;line-height:2}
@media(max-width:580px){header{padding:14px}.grid{padding:14px;gap:10px}header h1{font-size:1.15rem}}
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────────
let favs=JSON.parse(localStorage.getItem('id_favs')||'[]');
let cur=null, filtered=[], favMode=false;
const $=id=>document.getElementById(id);
const DL=['','Ľahká','Stredná','Náročná'];
const DC=['','e','m','h'];
const saveFavs=()=>localStorage.setItem('id_favs',JSON.stringify(favs));

// ─── RENDER ──────────────────────────────────────────────────────────────────
function getList(){
  const q=$('srch').value.toLowerCase();
  const cat=$('fCat').value, diff=$('fDiff').value, srt=$('fSort').value;
  let list=[...P];
  if(favMode) list=list.filter(p=>favs.includes(p.id));
  if(q) list=list.filter(p=>p.n.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q));
  if(cat) list=list.filter(p=>p.c===cat);
  if(diff) list=list.filter(p=>p.d===+diff);
  if(srt==='az') list.sort((a,b)=>a.n.localeCompare(b.n,'sk'));
  else if(srt==='da') list.sort((a,b)=>a.d-b.d);
  else if(srt==='dd') list.sort((a,b)=>b.d-a.d);
  else if(srt==='fav') list.sort((a,b)=>favs.includes(b.id)-favs.includes(a.id));
  else list.sort((a,b)=>a.id-b.id);
  return list;
}
function dots3(d,cls){
  return [1,2,3].map(i=>`<div class="dot ${i<=d?cls:''}"></div>`).join('');
}
function render(){
  const list=getList();
  filtered=list.map(p=>p.id);
  // stats
  const cc={};list.forEach(p=>cc[p.c]=(cc[p.c]||0)+1);
  $('stats').innerHTML=`<span>📋 Polôh: <strong>${list.length}</strong></span>`+
    Object.entries(cc).map(([k,v])=>`<span>${k}: ${v}</span>`).join('')+
    `<span>❤️ Obľúbené: ${favs.length}</span>`;
  // cards
  if(!list.length){$('grid').innerHTML=`<div class="empty">🔍 Žiadne polohy nenájdené.<br><small>Zmeňte filter alebo hľadaný výraz.</small></div>`;return;}
  $('grid').innerHTML=list.map(p=>`
    <div class="card" onclick="openM(${p.id})">
      <div class="card-top">
        <div class="card-name">${p.n}</div>
        <button class="fav-btn ${favs.includes(p.id)?'on':''}" onclick="event.stopPropagation();togFav(${p.id})">${favs.includes(p.id)?'❤️':'🤍'}</button>
      </div>
      <div class="card-cat">${p.c}</div>
      <div class="card-desc">${p.desc}</div>
      <div class="card-foot">
        <div class="dots">${dots3(p.d,DC[p.d])}</div>
        <span class="diff-lbl">${DL[p.d]}</span>
      </div>
    </div>`).join('');
}
function togFav(id){
  favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];
  saveFavs();render();if(cur===id)updMFav();
}
function togFavMode(){
  favMode=!favMode;
  $('btnFav').textContent=favMode?'📋 Všetky':'❤️ Obľúbené';
  $('btnFav').style.borderColor=favMode?'var(--gold)':'';
  render();
}
function rnd(){const list=getList();if(!list.length)return;openM(list[Math.floor(Math.random()*list.length)].id);}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openM(id){
  const p=P.find(x=>x.id===id);if(!p)return;
  cur=id;
  $('mcat').textContent=p.c;
  $('mname').textContent=p.n;
  $('mdots').innerHTML=[1,2,3].map(i=>`<div class="mdot ${i<=p.d?DC[p.d]:''}"></div>`).join('');
  $('mdlbl').textContent=`${DL[p.d]} (${p.d}/3)`;
  $('mdesc').textContent=p.desc;
  $('mtip').textContent=p.tip;
  $('mprompt').textContent=p.pr;
  updMFav();
  $('mbg').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function updMFav(){
  const b=$('mfavbtn');
  const on=favs.includes(cur);
  b.textContent=on?'❤️ Obľúbená':'🤍 Pridať';
  b.className='mfav'+(on?' on':'');
}
function closeM(){$('mbg').classList.add('hidden');document.body.style.overflow='';cur=null;}
function bgClick(e){if(e.target===$('mbg'))closeM();}
function nav(d){
  if(!cur||!filtered.length)return;
  const i=filtered.indexOf(cur);
  openM(filtered[(i+d+filtered.length)%filtered.length]);
}
function togMFav(){togFav(cur);}
function cpyPrompt(){
  navigator.clipboard.writeText($('mprompt').textContent).then(()=>{
    const b=document.querySelector('.bcopy');
    b.textContent='✅ Skopírované!';
    setTimeout(()=>b.textContent='📋 Skopírovať prompt',2000);
  });
}
document.addEventListener('keydown',e=>{
  if(!cur)return;
  if(e.key==='Escape')closeM();
  if(e.key==='ArrowRight')nav(1);
  if(e.key==='ArrowLeft')nav(-1);
});
render();
</script>
